version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: deployment/Dockerfile.api
    container_name: glucotwin_api
    ports:
      - "8000:8000"
    environment:
      - GLUCOTWIN_SEED=42
      - GLUCOTWIN_API_HOST=0.0.0.0
      - GLUCOTWIN_API_PORT=8000
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.frontend
    container_name: glucotwin_frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
